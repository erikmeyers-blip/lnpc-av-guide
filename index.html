<title>LNPC Sanctuary AV Guide</title>
<meta name="description" content="Quick, plain-language help for running sound, streaming, and assistive listening in the Lake Nokomis Presbyterian Church sanctuary.">
<meta name="theme-color" id="theme-color" content="#ffffff">
<script>
  /* Apply a saved Appearance choice before the first paint, so a reader
     who picked Dark never gets a flash of the light page. Kept inline
     and tiny on purpose — it has to run before the stylesheet paints. */
  (function () {
    try {
      var saved = localStorage.getItem('lnpc.theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) { /* private mode — fall back to following the phone */ }
  })();
</script>
